<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #87CEEB; /* 天空蓝 */
            overflow: hidden;
        }

        svg {
            width: 800px;
            height: 600px;
            background-color: #87CEEB;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* 轮子旋转动画 */
        .wheel {
            transform-origin: center;
            animation: rotate 2s linear infinite;
        }

        .wheel-back {
            transform-origin: center;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 鹈鹕身体上下颠簸动画 */
        .pelican-body {
            animation: bounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-5px); }
        }

        /* 背景云朵移动动画 */
        .cloud {
            animation: moveCloud 10s linear infinite;
        }

        .cloud-2 {
            animation: moveCloud 15s linear infinite;
            animation-delay: -5s;
        }

        @keyframes moveCloud {
            from { transform: translateX(800px); }
            to { transform: translateX(-200px); }
        }

        /* 地面线条移动动画 */
        .ground-line {
            stroke-dasharray: 20, 10;
            animation: moveGround 1s linear infinite;
        }

        @keyframes moveGround {
            from { stroke-dashoffset: 30; }
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景云朵 -->
    <g class="cloud" opacity="0.8">
        <circle cx="100" cy="100" r="30" fill="white" />
        <circle cx="130" cy="110" r="40" fill="white" />
        <circle cx="160" cy="100" r="30" fill="white" />
    </g>
    <g class="cloud-2" opacity="0.6">
        <circle cx="600" cy="80" r="25" fill="white" />
        <circle cx="625" cy="90" r="35" fill="white" />
        <circle cx="650" cy="80" r="25" fill="white" />
    </g>

    <!-- 地面 -->
    <rect x="0" y="500" width="800" height="100" fill="#90EE90" />
    <line x1="0" y1="500" x2="800" y2="500" stroke="#228B22" stroke-width="2" />
    <line class="ground-line" x1="0" y1="520" x2="800" y2="520" stroke="#228B22" stroke-width="2" />

    <!-- 自行车后轮 -->
    <g class="wheel-back" transform="translate(250, 450)">
        <circle r="50" fill="none" stroke="#333" stroke-width="3" />
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#333" stroke-width="2" />
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#333" stroke-width="2" />
        <line x1="-35" y1="-35" x2="35" y2="35" stroke="#333" stroke-width="2" />
        <line x1="-35" y1="35" x2="35" y2="-35" stroke="#333" stroke-width="2" />
    </g>

    <!-- 自行车前轮 -->
    <g class="wheel" transform="translate(550, 450)">
        <circle r="50" fill="none" stroke="#333" stroke-width="3" />
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#333" stroke-width="2" />
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#333" stroke-width="2" />
        <line x1="-35" y1="-35" x2="35" y2="35" stroke="#333" stroke-width="2" />
        <line x1="-35" y1="35" x2="35" y2="-35" stroke="#333" stroke-width="2" />
    </g>

    <!-- 自行车车架 -->
    <g stroke="#8B4513" stroke-width="4" fill="none">
        <!-- 主车架 -->
        <path d="M 250 450 L 350 350 L 550 450 L 400 350 Z" />
        <!-- 前叉 -->
        <line x1="550" y1="450" x2="480" y2="300" />
        <!-- 车把 -->
        <line x1="480" y1="300" x2="520" y2="280" stroke-width="3" />
        <!-- 座椅 -->
        <line x1="350" y1="350" x2="350" y2="320" stroke-width="4" />
        <path d="M 330 320 L 370 320 L 360 310 L 340 310 Z" fill="#333" />
    </g>

    <!-- 鹈鹕 (包含在颠簸动画组中) -->
    <g class="pelican-body" transform="translate(300, 250)">
        <!-- 身体 -->
        <ellipse cx="50" cy="50" rx="40" ry="30" fill="#F5F5DC" stroke="#D2B48C" stroke-width="2" />
        
        <!-- 脖子 -->
        <path d="M 70 40 Q 90 10 60 20" stroke="#F5F5DC" stroke-width="15" fill="none" />
        
        <!-- 头部 -->
        <circle cx="65" cy="25" r="15" fill="#F5F5DC" stroke="#D2B48C" stroke-width="2" />
        
        <!-- 眼睛 -->
        <circle cx="70" cy="20" r="3" fill="black" />
        <circle cx="71" cy="19" r="1" fill="white" />
        
        <!-- 大嘴巴 (喙) -->
        <path d="M 75 25 Q 120 30 100 45 Q 80 50 75 40" fill="#FFA500" stroke="#CC8400" stroke-width="2" />
        <!-- 喉囊 -->
        <path d="M 75 40 Q 90 60 100 45" fill="#FFDAB9" stroke="#CC8400" stroke-width="1" opacity="0.8" />

        <!-- 翅膀 -->
        <ellipse cx="40" cy="50" rx="15" ry="10" fill="#E0E0E0" stroke="#D2B48C" stroke-width="1" transform="rotate(-20 40 50)" />

        <!-- 腿 (简化) -->
        <line x1="50" y1="70" x2="50" y2="90" stroke="#FFA500" stroke-width="4" />
        <!-- 脚在踏板上 (近似位置) -->
        <circle cx="50" cy="90" r="5" fill="#FFA500" />
    </g>
</svg>

</body>
</html>
