<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #87CEEB; /* 天空蓝背景 */
            overflow: hidden;
        }

        .scene {
            width: 600px;
            height: 400px;
            position: relative;
        }

        /* 地面 */
        .ground {
            fill: #90EE90; /* 浅绿色草地 */
        }

        /* 车轮旋转动画 */
        .wheel {
            transform-origin: center;
            animation: rotateWheel 2s linear infinite;
        }

        @keyframes rotateWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 鹈鹕身体上下颠簸动画 (模拟骑行) */
        .pelican-body {
            animation: bounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }

        /* 鹈鹕头部点头动画 */
        .pelican-head {
            transform-origin: 10px 10px;
            animation: nod 0.5s ease-in-out infinite alternate;
        }

        @keyframes nod {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(5deg); }
        }

        /* 腿部踩踏动画 */
        .leg {
            transform-origin: 0 0;
            animation: pedal 1s linear infinite;
        }

        .leg-back {
            animation: pedal 1s linear infinite reverse;
        }

        @keyframes pedal {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(90deg); }
            50% { transform: rotate(180deg); }
            75% { transform: rotate(270deg); }
            100% { transform: rotate(360deg); }
        }

        /* 云朵移动 */
        .cloud {
            animation: moveCloud 20s linear infinite;
        }

        @keyframes moveCloud {
            from { transform: translateX(600px); }
            to { transform: translateX(-200px); }
        }
    </style>
</head>
<body>

<div class="scene">
    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
        <!-- 背景云朵 -->
        <g class="cloud" opacity="0.8">
            <circle cx="100" cy="80" r="30" fill="white"/>
            <circle cx="130" cy="90" r="40" fill="white"/>
            <circle cx="160" cy="80" r="30" fill="white"/>
        </g>
        <g class="cloud" opacity="0.6" style="animation-delay: -10s;">
            <circle cx="400" cy="50" r="20" fill="white"/>
            <circle cx="420" cy="60" r="30" fill="white"/>
            <circle cx="450" cy="50" r="20" fill="white"/>
        </g>

        <!-- 地面 -->
        <rect x="0" y="350" width="600" height="50" class="ground" />

        <!-- 自行车 -->
        <g id="bicycle">
            <!-- 后轮 -->
            <g class="wheel" transform="translate(150, 300)">
                <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="4"/>
                <g stroke="#333" stroke-width="2">
                    <line x1="0" y1="-40" x2="0" y2="40" />
                    <line x1="-40" y1="0" x2="40" y2="0" />
                    <line x1="-28" y1="-28" x2="28" y2="28" />
                    <line x1="-28" y1="28" x2="28" y2="-28" />
                </g>
            </g>
            
            <!-- 前轮 -->
            <g class="wheel" transform="translate(400, 300)">
                <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="4"/>
                <g stroke="#333" stroke-width="2">
                    <line x1="0" y1="-40" x2="0" y2="40" />
                    <line x1="-40" y1="0" x2="40" y2="0" />
                    <line x1="-28" y1="-28" x2="28" y2="28" />
                    <line x1="-28" y1="28" x2="28" y2="-28" />
                </g>
            </g>

            <!-- 车架 -->
            <path d="M150 300 L250 200 L400 300 L250 200 L200 250" fill="none" stroke="#D32F2F" stroke-width="6" stroke-linejoin="round"/>
            <path d="M250 200 L230 150" fill="none" stroke="#D32F2F" stroke-width="6" stroke-linecap="round"/> <!-- 车把立管 -->
            
            <!-- 车座 -->
            <path d="M200 250 L220 250" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
            
            <!-- 车把 -->
            <path d="M230 150 L260 140" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
        </g>

        <!-- 鹈鹕 -->
        <g class="pelican-body" transform="translate(180, 180)">
            <!-- 身体 -->
            <ellipse cx="50" cy="40" rx="40" ry="30" fill="#FFF" stroke="#333" stroke-width="2"/>
            
            <!-- 脖子 -->
            <path d="M30 20 Q20 0 40 -20" fill="none" stroke="#FFF" stroke-width="15" stroke-linecap="round"/>
            
            <!-- 头部 -->
            <g class="pelican-head" transform="translate(40, -20)">
                <circle cx="0" cy="0" r="15" fill="#FFF" stroke="#333" stroke-width="2"/>
                <!-- 眼睛 -->
                <circle cx="5" cy="-5" r="3" fill="#000"/>
                <!-- 大嘴巴 (鹈鹕特征) -->
                <path d="M0 0 Q20 10 10 20 Q5 15 0 10" fill="#FFA500" stroke="#333" stroke-width="2"/>
                <path d="M10 20 Q15 25 5 25" fill="#FFA500" stroke="#333" stroke-width="2"/> <!-- 喉囊 -->
            </g>

            <!-- 翅膀 -->
            <path d="M40 40 Q60 30 50 50" fill="#EEE" stroke="#333" stroke-width="2"/>

            <!-- 腿 (连接踏板) -->
            <!-- 右腿 (前踏板) -->
            <g class="leg" transform="translate(50, 60)">
                <line x1="0" y1="0" x2="10" y2="20" stroke="#FFA500" stroke-width="6" stroke-linecap="round"/>
                <!-- 脚 -->
                <ellipse cx="10" cy="20" rx="8" ry="4" fill="#FFA500" transform="rotate(45 10 20)"/>
            </g>
            
            <!-- 左腿 (后踏板) -->
            <g class="leg-back" transform="translate(50, 60)">
                <line x1="0" y1="0" x2="-10" y2="20" stroke="#FFA500" stroke-width="6" stroke-linecap="round"/>
                <!-- 脚 -->
                <ellipse cx="-10" cy="20" rx="8" ry="4" fill="#FFA500" transform="rotate(-45 -10 20)"/>
            </g>
        </g>
        
        <!-- 踏板曲柄 (视觉参考) -->
        <g transform="translate(250, 250)">
            <circle cx="0" cy="0" r="10" fill="#333"/>
            <line x1="0" y1="0" x2="10" y2="10" stroke="#333" stroke-width="4" class="leg" transform="translate(-10, -10)"/> 
            <!-- 注意：这里的腿动画是相对于鹈鹕身体的，为了简化，我们将踏板画在自行车上，腿画在鹈鹕上，通过CSS配合模拟踩踏感 -->
        </g>
    </svg>
</div>

</body>
</html>
