<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #87CEEB; /* 天空蓝背景 */
            overflow: hidden;
        }

        .scene {
            width: 600px;
            height: 400px;
        }

        /* 车轮旋转动画 */
        .wheel {
            transform-origin: center;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 鹈鹕身体上下颠簸动画 (模拟骑行) */
        .pelican-body {
            animation: bounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* 鹈鹕头部点头动画 */
        .pelican-head {
            transform-origin: 200px 180px; /* 颈部连接点 */
            animation: nod 0.5s ease-in-out infinite alternate;
        }

        @keyframes nod {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(5deg); }
        }

        /* 地面线条移动动画 (模拟前进) */
        .ground-line {
            animation: moveGround 1s linear infinite;
        }

        @keyframes moveGround {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -40; }
        }
    </style>
</head>
<body>

    <svg class="scene" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
        <!-- 背景云朵 -->
        <circle cx="100" cy="80" r="30" fill="white" opacity="0.8"/>
        <circle cx="130" cy="90" r="30" fill="white" opacity="0.8"/>
        <circle cx="500" cy="50" r="40" fill="white" opacity="0.8"/>
        
        <!-- 地面 -->
        <line x1="0" y1="350" x2="600" y2="350" stroke="#555" stroke-width="4" stroke-dasharray="20,20" class="ground-line"/>

        <!-- 自行车 -->
        <g id="bicycle">
            <!-- 后轮 -->
            <circle cx="200" cy="300" r="50" fill="none" stroke="#333" stroke-width="4" class="wheel"/>
            <g class="wheel">
                <line x1="200" y1="250" x2="200" y2="350" stroke="#333" stroke-width="2"/>
                <line x1="150" y1="300" x2="250" y2="300" stroke="#333" stroke-width="2"/>
                <line x1="165" y1="265" x2="235" y2="335" stroke="#333" stroke-width="2"/>
                <line x1="165" y1="335" x2="235" y2="265" stroke="#333" stroke-width="2"/>
            </g>

            <!-- 前轮 -->
            <circle cx="400" cy="300" r="50" fill="none" stroke="#333" stroke-width="4" class="wheel"/>
            <g class="wheel">
                <line x1="400" y1="250" x2="400" y2="350" stroke="#333" stroke-width="2"/>
                <line x1="350" y1="300" x2="450" y2="300" stroke="#333" stroke-width="2"/>
                <line x1="365" y1="265" x2="435" y2="335" stroke="#333" stroke-width="2"/>
                <line x1="365" y1="335" x2="435" y2="265" stroke="#333" stroke-width="2"/>
            </g>

            <!-- 车架 -->
            <path d="M200 300 L280 200 L400 300 L280 200 L240 240" fill="none" stroke="#D32F2F" stroke-width="6" stroke-linejoin="round"/>
            <line x1="280" y1="200" x2="380" y2="220" stroke="#D32F2F" stroke-width="6" stroke-linecap="round"/>
            
            <!-- 车座 -->
            <path d="M260 200 L280 190 L300 200" fill="#333" stroke="none"/>
            
            <!-- 车把 -->
            <path d="M380 220 L390 180 L410 180" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- 鹈鹕 (绑定在 bounce 动画上) -->
        <g class="pelican-body">
            <!-- 身体 -->
            <ellipse cx="280" cy="220" rx="40" ry="30" fill="#FFF" stroke="#333" stroke-width="2"/>
            
            <!-- 腿部 (简单绘制) -->
            <line x1="280" y1="240" x2="320" y2="280" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
            <line x1="280" y1="240" x2="240" y2="280" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
            
            <!-- 脚蹬在踏板上的简化表现 -->
            <circle cx="320" cy="280" r="5" fill="#333"/>
            <circle cx="240" cy="280" r="5" fill="#333"/>

            <!-- 头部 (绑定在 nod 动画上) -->
            <g class="pelican-head">
                <!-- 头 -->
                <circle cx="240" cy="180" r="25" fill="#FFF" stroke="#333" stroke-width="2"/>
                <!-- 大嘴巴 (鹈鹕特征) -->
                <path d="M255 180 Q300 200 255 220 Q240 210 255 180" fill="#FFA500" stroke="#333" stroke-width="2"/>
                <path d="M255 180 Q280 190 255 200" fill="none" stroke="#333" stroke-width="1"/>
                <!-- 眼睛 -->
                <circle cx="235" cy="175" r="3" fill="#000"/>
                <!-- 翅膀 -->
                <path d="M260 220 Q290 200 270 240" fill="#EEE" stroke="#333" stroke-width="2"/>
            </g>
            
            <!-- 手扶车把 -->
            <line x1="260" y1="190" x2="390" y2="180" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
        </g>
    </svg>

</body>
</html>
