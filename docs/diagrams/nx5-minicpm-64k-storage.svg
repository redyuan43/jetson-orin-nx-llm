<text x="60" y="132" font-size="46" fill="#173149" font-weight="700" text-anchor="start">nx5 的模型，存在哪里？</text>
<text x="60" y="178" font-size="22" fill="#536B7D" font-weight="400" text-anchor="start" data-max-width="1680">当前固定方案：SSD 保存全量专家，统一内存缓存一部分；CPU 负责调度与读盘，GPU 直接读取缓存参与计算。</text>
